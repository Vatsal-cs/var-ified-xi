name: Refresh squad

# Runs the data engine before each FPL deadline and commits the result, which
# is what triggers Vercel to redeploy the dashboard. The whole thing fits in
# GitHub's free tier: the job only does real work in the hours before a
# deadline, and exits in seconds otherwise.
on:
  schedule:
    # Every four hours. GitHub's scheduler is best-effort and runs late under
    # load: before GW7 2026-27 the 07:00 UTC run started at 11:31, after the
    # 10:00 deadline, and the 19:00 one at 21:57. Twice a day could leave the
    # last check before a deadline a day old. Off-deadline runs exit in
    # seconds; on a private repo this stays well inside the free 2,000
    # minutes, and the free plan's $0 spending limit means it can never bill.
    - cron: "0 1,5,9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if no deadline is near"
        type: boolean
        default: true

concurrency:
  group: refresh-squad
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # The archive CSVs for past seasons are large and never change once a
      # season is complete, so downloading them every run is pure waste.
      - name: Restore historical data cache
        uses: actions/cache@v4
        with:
          path: backend/data/raw/historical_*
          key: fpl-historical-v1

      # Matches outside the Premier League (data_engine/other_matches.py).
      # Finished months and matches never change, so the cache only grows.
      - name: Restore other-matches cache
        uses: actions/cache@v4
        with:
          path: backend/data/raw/espn
          key: espn-${{ github.run_id }}
          restore-keys: espn-

      - name: Check whether a deadline is near
        id: gate
        working-directory: backend
        env:
          FORCE: ${{ inputs.force }}
        run: python check_deadline.py

      - name: Run the data engine
        if: steps.gate.outputs.should_run == 'true'
        working-directory: backend
        env:
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
          # Optional: turns on the team-news reader (data_engine/team_news.py).
          # Gemini's key is free (aistudio.google.com); Claude's is the paid option.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Commit the refreshed squad
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/optimized_team.json backend/data/injury_log.json
          git add backend/data/team_news.json backend/data/team_news_log.json backend/data/team_news_calls.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "Refresh squad for GW${{ steps.gate.outputs.gameweek }}"
            git push
          fi
