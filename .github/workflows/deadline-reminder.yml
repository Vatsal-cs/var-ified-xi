name: Deadline reminder

# Posts the week's plan about 5 hours before each FPL deadline (9pm the evening
# before, for a deadline before 9am your time), and again after
# the last news read about 2 hours before it (final-refresh.yml), as comments
# that mention you on one GitHub issue. GitHub emails them and pushes them to its
# mobile app (backend/deadline_reminder.py). Needs no secrets. Far from a
# deadline a run does nothing but check the time.
on:
  schedule:
    # Asks for hourly, away from the top of the hour when GitHub's scheduler is
    # busiest. It still only ran every 5-8 hours, so a run up to 5.5 hours before
    # the window waits for it, and each refresh is another chance to catch it.
    - cron: "23 * * * *"
  workflow_run:
    workflows: ["Refresh squad"]
    types: [completed]
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test now (doesn't use up the week's reminder)"
        type: boolean
        default: true

concurrency:
  group: deadline-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Wait for the window if it opens soon
        working-directory: backend
        env:
          TEST: ${{ inputs.test }}
        run: python deadline_reminder.py --wait

      # The wait can be hours long, and the plan may have refreshed meanwhile.
      - name: Get the newest plan
        run: |
          git fetch --depth=1 origin main
          git checkout --force FETCH_HEAD

      - name: Send the reminder if it's time
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST: ${{ inputs.test }}
        run: python deadline_reminder.py
