name: Season simulation

# Races transfer policies over completed seasons and writes the result table
# into the run summary, so it can be read on github.com without pulling
# anything down.
#
# Manual only. This is a research job, not part of the weekly pipeline: it
# takes hours rather than minutes and nothing downstream depends on it.
#
# Each season x seed runs as its own job, in parallel. A season trains on the
# seasons listed before it (as --augment did when they ran in one job), so
# "2024-25 2025-26" runs 2025-26 with --prior-seasons 2024-25. Download the
# per-job JSON with `gh run download` and pool it with data_engine.evaluation.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to simulate, space separated"
        type: string
        default: "2024-25 2025-26"
      policies:
        description: "Policies to race, space separated"
        type: string
        default: "production production_no_hits production_hm2 production_hm6 no_transfers"
      seeds:
        description: "Model seeds, space separated (one seed can't separate a change from noise)"
        type: string
        default: "42 7 13"
      stride:
        description: "Simulate every Nth gameweek (1 = every week; higher is faster but distorts the transfer economy)"
        type: string
        default: "1"
      start_gw:
        description: "First gameweek to simulate"
        type: string
        default: "2"
      extra_args:
        description: "Further season_sim flags, e.g. --lineup --bag-size 1 or --branch production:production_e4"
        type: string
        default: ""

concurrency:
  group: season-simulation
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          SEASONS: ${{ inputs.seasons }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          seasons = os.environ["SEASONS"].split()
          seeds = os.environ["SEEDS"].split()
          include = [{"season": s, "prior": " ".join(seasons[:i]), "seed": seed}
                     for i, s in enumerate(seasons) for seed in seeds]
          print("matrix=" + json.dumps({"include": include}))
          EOF

  simulate:
    needs: plan
    runs-on: ubuntu-latest
    # A full season of MILP solving per job. Well inside GitHub's 6-hour
    # ceiling, but not by so much that the default 360 can be left implicit.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Restore historical data cache
        uses: actions/cache@v4
        with:
          path: |
            backend/data/raw/historical_*
            backend/data/raw/availability_*
          key: fpl-historical-v2

      - name: Run the simulation
        working-directory: backend
        env:
          SEASON: ${{ matrix.season }}
          PRIOR: ${{ matrix.prior }}
          SEED: ${{ matrix.seed }}
          POLICIES: ${{ inputs.policies }}
          START_GW: ${{ inputs.start_gw }}
          STRIDE: ${{ inputs.stride }}
          EXTRA: ${{ inputs.extra_args }}
        run: |
          set -o pipefail
          prior=()
          [ -n "$PRIOR" ] && prior=(--prior-seasons $PRIOR)
          python -u -m data_engine.season_sim \
            --seasons "$SEASON" "${prior[@]}" \
            --policies $POLICIES \
            --seeds "$SEED" \
            --start-gw "$START_GW" \
            --stride "$STRIDE" \
            $EXTRA \
            --out simulation.json \
            2>&1 | tee simulation.log

      - name: Publish the result table to the run summary
        if: always()
        working-directory: backend
        env:
          SEASON: ${{ matrix.season }}
          SEED: ${{ matrix.seed }}
          POLICIES: ${{ inputs.policies }}
          STRIDE: ${{ inputs.stride }}
          EXTRA: ${{ inputs.extra_args }}
        run: |
          {
            echo "## Season simulation · $SEASON · seed $SEED"
            echo ""
            echo "\`policies: $POLICIES\` &middot; \`stride: $STRIDE\` &middot; \`extra: $EXTRA\`"
            echo ""
            echo '```'
            # The pooled verdict table is the tail; the per-gameweek lines
            # above it are in the uploaded log for anyone who wants them.
            tail -n 40 simulation.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-${{ matrix.season }}-s${{ matrix.seed }}
          path: |
            backend/simulation.log
            backend/simulation.json
          retention-days: 30
